name: Run Behat Tests for LiveQuiz

on:
  push:
    branches:
      - behat-carl
  pull_request:
    branches:
      - main

jobs:
  behat-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, xml, curl, zip
          ini-values: post_max_size=256M

      - name: Copy composer.json
        run: |
          cp permcashe/permcomposer.json composer.json

      - name: Install Composer dependencies
        run: composer install

      - name: Create Behat config
        run: |
          cat <<EOF > behat.yml
          default:
            extensions:
              Behat\MinkExtension:
                goutte: ~
                selenium2: ~
                base_url: 'http://localhost'
            suites:
              default:
                paths: [ "%paths.base%/server/moodle/mod/livequiz/tests/behat" ]
                contexts:
                  - FeatureContext
          EOF

      - name: Run Behat Tests for LiveQuiz
        run: |
          vendor/bin/behat --config behat.yml --tags="@mod_livequiz"
