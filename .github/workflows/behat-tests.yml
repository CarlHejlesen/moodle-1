name: Run Behat Tests for LiveQuiz

on:
  push:
    branches:
      - behat-carl
  pull_request:
    branches:
      - main

jobs:
  behat-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4' # Juster PHP-versionen efter behov
          extensions: mbstring, intl, xml, curl, zip
          ini-values: post_max_size=256M

      - name: Create composer.json
        run: |
          cat <<EOF > composer.json
          {
              "name": "moodle/moodle",
              "license": "GPL-3.0-or-later",
              "description": "Moodle - the world's open source learning platform",
              "type": "project",
              "homepage": "https://moodle.org",
              "require-dev": {
                  "phpunit/phpunit": "^9.6.18",
                  "mikey179/vfsstream": "1.6.*",
                  "behat/mink": "^1.11.0",
                  "friends-of-behat/mink-extension": "^2.7.5",
                  "behat/mink-browserkit-driver": "^2.2.0",
                  "symfony/process": "^4.4 || ^5.0 || ^6.0 || ^7.0",
                  "symfony/http-client": "^4.4 || ^5.0 || ^6.0 || ^7.0",
                  "symfony/mime": "^4.4 || ^5.0 || ^6.0 || ^7.0",
                  "behat/behat": "3.14.*",
                  "oleg-andreyev/mink-phpwebdriver": "1.3.*",
                  "filp/whoops": "^2.15"
              },
              "autoload-dev": {
                  "psr-0": {
                      "Moodle\\\\BehatExtension": "lib/behat/extension/"
                  }
              },
              "minimum-stability": "dev",
              "prefer-stable": true,
              "require": {
                  "php": ">=8.1.0",
                  "ext-iconv": "*",
                  "ext-mbstring": "*",
                  "ext-curl": "*",
                  "ext-openssl": "*",
                  "ext-ctype": "*",
                  "ext-zip": "*",
                  "ext-zlib": "*",
                  "ext-gd": "*",
                  "ext-simplexml": "*",
                  "ext-spl": "*",
                  "ext-pcre": "*",
                  "ext-dom": "*",
                  "ext-xml": "*",
                  "ext-xmlreader": "*",
                  "ext-intl": "*",
                  "ext-json": "*",
                  "ext-hash": "*",
                  "ext-fileinfo": "*",
                  "ext-sodium": "*"
              },
              "suggest": {
                  "ext-mysqli": "Needed when Moodle uses MySQL or MariaDB database.",
                  "ext-pgsql": "Needed when Moodle uses PostgreSQL database.",
                  "ext-sqlsrv": "Needed when Moodle uses MS SQL Server database.",
                  "ext-oci8": "Needed when Moodle uses Oracle database.",
                  "ext-tokenizer": "Enabling Tokenizer PHP extension is recommended, it improves Moodle Networking functionality.",
                  "ext-soap": "Enabling SOAP PHP extension is useful for web services and some plugins.",
                  "ext-exif": "Enabling Exif PHP extension is recommended, it is used by Moodle to parse image meta data."
              }
          }
          EOF

      - name: Install Composer dependencies
        run: composer install

      - name: Create temporary Moodle config.php
        run: |
          echo "<?php" > config.php
          echo "\$CFG = new stdClass();" >> config.php
          echo "\$CFG->dbtype    = 'mysqli';" >> config.php
          echo "\$CFG->dblibrary = 'native';" >> config.php
          echo "\$CFG->dbhost    = '127.0.0.1';" >> config.php
          echo "\$CFG->dbname    = 'moodle';" >> config.php
          echo "\$CFG->dbuser    = 'root';" >> config.php
          echo "\$CFG->dbpass    = 'root';" >> config.php
          echo "\$CFG->prefix    = 'mdl_';" >> config.php
          echo "\$CFG->wwwroot   = 'http://localhost';" >> config.php
          echo "\$CFG->dataroot  = '/tmp/moodledata';" >> config.php
          echo "\$CFG->admin     = 'admin';" >> config.php
          echo "\$CFG->directorypermissions = 02777;" >> config.php
          echo "\$CFG->behat_prefix = 'b_';" >> config.php
          echo "\$CFG->behat_dataroot = '/tmp/behatdata';" >> config.php
          echo "require_once(dirname(__FILE__) . '/lib/setup.php');" >> config.php

      - name: Init Behat for mod_livequiz
        run: |
          php admin/tool/behat/cli/init.php

      - name: Run Behat Tests for LiveQuiz
        run: |
          php admin/tool/behat/cli/run.php --component=mod_livequiz --tags="@mod_livequiz"
