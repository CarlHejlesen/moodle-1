name: Behat

on:
  pull_request:
    branches: ["main", "staging"]
  push:
    branches: ["behat-carl"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server
          sudo systemctl disable mariadb
          sudo systemctl stop mariadb

      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0' # Specify version
          extensions: phar, iconv, mbstring, gd, intl, sodium, zip
          tools: composer

      - name: Set up MariaDB and Moodle Database
        run: |
            set -e # Exit immediately if any command fails
            mariadb_data_dir="./mariadb_data"
            mariadb_socket="/run/mysqld/mysqld.sock"
            moodle_db_name="moodle"
            moodle_sql_file="./MoodleSQL.sql"
            root_username="root"
            root_password="root"
  
            # Prepare MariaDB data directory
            mkdir -p "${mariadb_data_dir}"
  
            # Initialize MariaDB if not done
            if [ ! -d "${mariadb_data_dir}/mysql" ]; then
              mysql_install_db --datadir=${mariadb_data_dir}
              sudo chmod -R 2777 "$(dirname ${mariadb_socket})"
              mysqld --datadir=${mariadb_data_dir} --socket=${mariadb_socket} --skip-grant-tables &
              TEMP_MYSQL_PID=$!
  
              while [ ! -S ${mariadb_socket} ]; do
                echo "Waiting for MariaDB socket..."
                sleep 2
              done
  
              echo "Setting root password..."
              mysql -uroot -S${mariadb_socket} <<EOF
              FLUSH PRIVILEGES;
              ALTER USER 'root'@'localhost' IDENTIFIED BY '${root_password}';
              FLUSH PRIVILEGES;
             EOF
              
              # Ensure EOF ends the block, then run additional commands outside the EOF block
              mysql -uroot -p${root_password} -S${mariadb_socket} -e "CREATE DATABASE IF NOT EXISTS ${moodle_db_name}"
              
              if [ -f "${moodle_sql_file}" ]; then
                mysql -uroot -p${root_password} -S${mariadb_socket} ${moodle_db_name} < ${moodle_sql_file} || echo "SQL file import failed"
              fi
              
              kill $TEMP_MYSQL_PID
              wait $TEMP_MYSQL_PID
            fi
  
            # Start MariaDB
            mysqld --datadir=${mariadb_data_dir} --socket=${mariadb_socket} &
            MARIADB_PID=$!
            sleep 5
  
      - name: Start PHP server for Moodle
        run: |
          php -S 0.0.0.0:8000 -t "$(pwd)/server/moodle" &
          PHP_SERVER_PID=$!

      - name: Set up geckodriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialise Moodle to create config.php
        run: |
          echo en_AU.UTF-8 UTF-8 | sudo tee -a /etc/locale.gen
          sudo locale-gen
          if [ "$(php -r "echo ini_get('max_input_vars');")" -lt 5000 ]; then
            echo "max_input_vars = 5000" | sudo tee -a /etc/php/8.0/cli/php.ini
          fi
          export LANG="en_AU.UTF-8"
          export LC_ALL="en_AU.UTF-8"
          
          cd server/moodle
          php admin/cli/install.php \
              --lang=en \
              --wwwroot="http://127.0.0.1:8000/" \
              --dataroot="$(pwd)/moodledata" \
              --dbpass=${root_password} \
              --dbsocket=${mariadb_socket} \
              --skip-database \
              --non-interactive \
              --agree-license \
              --allow-unstable \
              --fullname="Moodle testing thing" \
              --shortname="mtt" \
              --adminpass="hunter2"

      - name: Set up Selenium
        run: |
          wget https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.25.0/selenium-server-4.25.0.jar
          java -jar selenium-server-4.25.0.jar standalone &

      - name: Install and initialize Behat
        run: |
          cd server/moodle
          echo '$CFG->behat_wwwroot = "http://localhost:8000";' >> config.php
          echo '$CFG->behat_prefix = "beh_";' >> config.php
          composer install
          php admin/tool/behat/cli/init.php

      - name: Run Behat tests
        run: |
          cd server/moodle
          vendor/bin/behat -vv --config "$(realpath ../moodledata/behat/behatrun/behat.yml)" || exit 1

      - name: Cleanup
        run: |
          kill $MARIADB_PID $PHP_SERVER_PID || echo "Cleanup failed"
          rm -f ${mariadb_socket}
