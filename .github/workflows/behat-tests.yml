name: Moodle Plugin CI & Behat

on:
  pull_request:
    branches: [ "main", "staging" ]
  push:
    branches: [ "behat-carl" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y mariadb-server firefox
          sudo apt install -y php php-mbstring php-zip php-xml php-soap php-intl php-sodium php-gd php-xmlrpc
          
      - name: Exorcises Snap from the system
        run: |
          echo ✝️✝️ GO AWAY SNAP GO AWAY GO AWAY ✝️✝️
          sudo apt autoremove --purge snapd
          sudo apt-mark hold snapd

      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          extensions: phar, iconv, mbstring, gd, intl, sodium, zip
          tools: composer

      - name: Install Composer and Moodle Plugin CI
        run: |
          composer install
          composer require moodlehq/moodle-plugin-ci

      - name: Set up the database
        run: |
          sudo systemctl start mariadb
          sudo mysql -e "CREATE DATABASE moodle;"

      - name: Initialise moodle, create config.php
        run: |
          echo en_AU.UTF-8 UTF-8 | sudo tee -a /etc/locale.gen
          sudo locale-gen
          
          REPO_ROOT="`pwd`"
          cd "$REPO_ROOT"/server/moodle
          php admin/cli/install.php \
              --lang=en \
              --wwwroot="http://127.0.0.1:8000/" \
              --dataroot="$REPO_ROOT/server/moodledata" \
              --dbpass=root \
              --dbsocket=/run/mysqld/mysqld.sock \
              --skip-database \
              --non-interactive \
              --agree-license \
              --allow-unstable \
              --fullname="Moodle Testing" \
              --shortname="mtt" \
              --adminpass="hunter2"
              
      - name: Install & Init Behat
        run: | 
          cd server/moodle
          php admin/tool/behat/cli/init.php

      - name: Setup Firefox Driver for Behat
        uses: browser-actions/setup-geckodriver@latest

      - name: Set up Selenium
        run: |
          wget https://github.com/SeleniumHQ/selenium/releases/download/selenium-4.25.0/selenium-server-4.25.0.jar
          java -jar selenium-server-4.25.0.jar standalone &

      - name: Download moodle-browser-config
        run: |
          export MBCPATH=`realpath .`/moodle-browser-config
          git clone https://github.com/andrewnicols/moodle-browser-config $MBCPATH
          sed -i "/^require_once(__DIR__ . '\/lib\/setup.php');/i require_once('$MBCPATH/init.php');" server/moodle/config.php

      - name: Run Behat tests for mod/livequiz
        run: |
          cd server/moodle
          vendor/bin/behat --config `realpath ../moodledata/behat/behatrun/behat/behat.yml` --profile=headlessfirefox --tags=@mod_livequiz

      - name: Run Moodle Plugin CI tests for mod/livequiz
        run: |
          moodle-plugin-ci phplint server/moodle/mod/livequiz
          moodle-plugin-ci phpcpd server/moodle/mod/livequiz
          moodle-plugin-ci phpmd server/moodle/mod/livequiz
          moodle-plugin-ci phpcs --max-warnings 0 server/moodle/mod/livequiz
          moodle-plugin-ci phpunit --path=server/moodle/mod/livequiz --verbose --coverage-text --fail-on-warning
