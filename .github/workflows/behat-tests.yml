name: Moodle Plugin CI

on: [push, pull_request, workflow_dispatch]

jobs:
  selftest:
    name: CI test (Code Validation)
    runs-on: ubuntu-22.04

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Setup PHP 7.4
      uses: shivammathur/setup-php@v2
      with:
        php-version: 7.4
        coverage: xdebug

    - name: Install Dependencies
      run: |
        composer install
        composer require moodlehq/moodle-plugin-ci

    - name: Validate Code
      run: moodle-plugin-ci phplint server/moodle/mod/livequiz

  citest:
    name: Integration tests for server/moodle/mod/livequiz
    needs: selftest
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            moodle-branch: 'main'
            moodle-app: 'true'

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: pgsql, zip, gd, xmlrpc, soap
        ini-values: max_input_vars=5000
        coverage: xdebug

    - name: Install Dependencies
      run: |
        composer install
        composer require moodlehq/moodle-plugin-ci

    - name: Install moodle-plugin-ci
      run: moodle-plugin-ci install -vvv
      env:
        DB: 'pgsql'
        MOODLE_BRANCH: ${{ matrix.moodle-branch }}
        MOODLE_APP: ${{ matrix.moodle-app }}

    - name: Run PHP Lint
      run: moodle-plugin-ci phplint server/moodle/mod/livequiz

    - name: Run PHP Copy-Paste Detector (CPD)
      run: moodle-plugin-ci phpcpd server/moodle/mod/livequiz

    - name: Run PHP Mess Detector (MD)
      run: moodle-plugin-ci phpmd server/moodle/mod/livequiz

    - name: Run CodeSniffer (PHPCS)
      run: moodle-plugin-ci phpcs --max-warnings 0 server/moodle/mod/livequiz

    - name: Run PHPUnit tests only for server/moodle/mod/livequiz
      run: moodle-plugin-ci phpunit --path=server/moodle/mod/livequiz --verbose --coverage-text --fail-on-warning

    - name: Run Behat tests only for server/moodle/mod/livequiz
      run: |
        moodle-plugin-ci behat --path=server/moodle/mod/livequiz --profile default
        moodle-plugin-ci behat --path=server/moodle/mod/livequiz --profile chrome
        moodle-plugin-ci behat --path=server/moodle/mod/livequiz --profile firefox --tags="@local_ci&&~@app"
